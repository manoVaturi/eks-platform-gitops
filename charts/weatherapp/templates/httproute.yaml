{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https # the HTTP listener only redirects to HTTPS (charts/gateway)
  hostnames:
    - {{ required "set gateway.host in the environment's values file" .Values.gateway.host }}
  rules:
    {{- if .Values.gateway.hideMetrics }}
    - matches: [{ path: { type: PathPrefix, value: /metrics } }]
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.k8s.aws
            kind: ListenerRuleConfiguration
            name: {{ .Chart.Name }}-metrics-not-found
    {{- end }}
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs:
        - { name: {{ .Chart.Name }}, port: 80, weight: 100 }
        {{- if .Values.rollout.enabled }}
        - { name: {{ .Chart.Name }}-canary, port: 80, weight: 0 }
        {{- end }}
{{- end }}
