{{- range .Values.targets }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  targetRef:
    apiVersion: {{ .apiVersion | default "apps/v1" }}
    kind: {{ .kind }}
    name: {{ .name }}
  updatePolicy:
    updateMode: "Off"
{{- end }}
