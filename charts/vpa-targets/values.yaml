# One VerticalPodAutoscaler per entry, always in updateMode Off: it advises, it never changes or restarts a pod.
targets:
  - { namespace: weatherapp, kind: Deployment, name: weatherapp }
  - { namespace: weatherapp-dev, kind: Rollout, apiVersion: argoproj.io/v1alpha1, name: weatherapp }
  - { namespace: monitoring, kind: Deployment, name: grafana }
  - { namespace: monitoring, kind: Deployment, name: mimir }
  - { namespace: monitoring, kind: Deployment, name: alloy }
  - { namespace: monitoring, kind: Deployment, name: kube-state-metrics }
  - { namespace: mongo, kind: StatefulSet, name: mongo }
  - { namespace: postgres, kind: StatefulSet, name: postgres }
  - { namespace: vault, kind: StatefulSet, name: vault }
  - { namespace: vault-secrets-operator-system, kind: Deployment, name: vault-secrets-operator-controller-manager }
  - { namespace: kyverno, kind: Deployment, name: kyverno-admission-controller }
  - { namespace: istio-system, kind: Deployment, name: istiod }
  - { namespace: redis, kind: Deployment, name: redis }
