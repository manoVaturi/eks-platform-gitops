{{- range .Values.namespaces }}
---
# Default deny: nothing connects to a pod in {{ . }} unless another policy allows it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Pods of {{ . }} may talk to each other
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
