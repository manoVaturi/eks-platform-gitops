apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  {{- if .Values.headless }}
  # Headless: DNS returns the pod's own address. A StatefulSet needs a governing Service like this.
  clusterIP: None
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app: {{ .Values.name }}
  ports:
    - {{- if .Values.headless }}
      name: {{ .Values.name }}
      {{- end }}
      port: {{ required "port is required" .Values.port }}
      targetPort: {{ .Values.name }}
