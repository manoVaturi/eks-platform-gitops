apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mimir.fullname" . }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  # One pod, replaced (not rolled): the data is an emptyDir and the rings address 127.0.0.1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mimir.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mimir.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mimir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -target={{ include "mimir.target" . }}
            - -config.file=/etc/mimir/mimir.yaml
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Mimir writes some files next to its working directory; the root filesystem is read-only
          workingDir: /data
          ports:
            - name: http
              containerPort: {{ include "mimir.httpPort" . }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "mimir.fullname" . }}-config
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.data.sizeLimit }}
        - name: tmp
          emptyDir: {}
