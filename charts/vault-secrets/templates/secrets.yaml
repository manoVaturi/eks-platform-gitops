{{- range $secret := .Values.secrets }}
{{- range $namespace := $secret.namespaces }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $namespace }}
spec:
  type: kv-v2
  mount: kv
  path: {{ $secret.path }}
  refreshAfter: {{ $.Values.refreshAfter }}
  destination:
    name: {{ $secret.name }}
    create: true
    overwrite: {{ $.Values.overwrite }}
{{- end }}
{{- end }}
