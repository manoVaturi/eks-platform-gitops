apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '1' # after the LBC (wave 0), which installs the gateway.k8s.aws CRDs
spec:
  project: platform
  source:
    repoURL: https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    targetRevision: main
    path: charts/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
