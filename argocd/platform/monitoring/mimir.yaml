# Mimir: metrics storage, one process, disposable disk (our own chart). Wave 3: before the things that write to it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  project: platform
  source:
    repoURL: https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    targetRevision: main
    path: charts/mimir
    helm:
      valueFiles:
        - ../../platform/monitoring/mimir/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
