# Vault, 1 of 4: the StorageClass and the static PersistentVolume that bind the EBS volume from Terraform layer 20. Wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: platform
  source:
    repoURL: https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    targetRevision: main
    path: charts/vault-storage
    helm:
      valueFiles:
        - ../../platform/vault/vault-storage/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
