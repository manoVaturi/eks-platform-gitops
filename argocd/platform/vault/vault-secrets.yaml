# Vault, 4 of 4: the VaultStaticSecret objects that become Kubernetes Secrets. Wave 4: after the operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: '4' # after VSO (wave 3)
spec:
  project: platform
  source:
    repoURL: https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    targetRevision: main
    path: charts/vault-secrets
    helm:
      valueFiles:
        - ../../platform/vault/vault-secrets/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
