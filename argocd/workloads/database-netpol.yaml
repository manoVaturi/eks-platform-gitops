# Network policies of the three databases, from charts/netpol. Lives in the "default" namespace,
# so it is not generated by the workloads ApplicationSet (which creates and labels its namespace).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-netpol
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: prod
  source:
    repoURL: https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    targetRevision: main
    path: charts/netpol
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The database namespaces may not exist yet on the first sync, so retry.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
