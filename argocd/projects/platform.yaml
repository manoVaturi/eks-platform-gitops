# AppProject platform: what the platform components may deploy, from where and to which namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Created before the Applications that name it.
    argocd.argoproj.io/sync-wave: '-10'
spec:
  description: 'Controllers shared by both environments'
  sourceRepos:
    - https://gitlab.manovaturi.com/weatherapp/weatherapp-gitops.git
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
    - https://istio-release.storage.googleapis.com/charts
    - https://kyverno.github.io/kyverno/
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://helm.releases.hashicorp.com
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://charts.fairwinds.com/stable
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://github.com/kubernetes-sigs/gateway-api.git
    - https://falcosecurity.github.io/charts
  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: istio-system
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: vault-secrets-operator-system
      server: https://kubernetes.default.svc
    - namespace: postgres
      server: https://kubernetes.default.svc
    - namespace: mongo
      server: https://kubernetes.default.svc
    - namespace: weatherapp
      server: https://kubernetes.default.svc
    - namespace: weatherapp-dev
      server: https://kubernetes.default.svc
    - namespace: redis
      server: https://kubernetes.default.svc
    - namespace: argo-rollouts
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: gateway-system
      server: https://kubernetes.default.svc
    - namespace: falco
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  # Cluster-wide kinds stay open: the charts ship CRDs, webhooks, ClusterRoles, StorageClasses and PVs.
  orphanedResources:
    warn: true
    ignore:
      - kind: Secret
        name: grafana-*
      - kind: ConfigMap
        name: istio-ca-*
