name: postgres
kind: StatefulSet
headless: true
replicas: 1
port: 5432
image: postgres:17.11-alpine
args: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
podSecurityContext:
  runAsUser: 70
  runAsGroup: 70
  fsGroup: 70
env:
  - name: POSTGRES_USER
    valueFrom:
      secretKeyRef: { name: postgres-credentials, key: username }
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef: { name: postgres-credentials, key: password }
  - name: POSTGRES_DB
    value: weatherapp
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata
readinessProbe:
  exec:
    command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
  periodSeconds: 10
livenessProbe:
  exec:
    command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
  initialDelaySeconds: 30
  periodSeconds: 20
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
volumeMounts:
  - name: data
    mountPath: /var/lib/postgresql/data
volumes:
  - name: data
    emptyDir: {}
