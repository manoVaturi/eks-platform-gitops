extends: default
ignore: |
  charts/*/templates/
  charts/grafana-dashboards/dashboards/
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    indent-sequences: consistent
